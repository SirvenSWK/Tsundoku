[project]
name = "tsundoku"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "pydantic>=2.13.5",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
tsundoku = "tsundoku:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
